<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<title>New song</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<style>
    body {
    position:relative;
    background-image:none;
    margin:0;
    min-height:100vh;
    font-family:"IBM Plex Serif", serif;
    text-align:center;
    color:#56420e;
}

body::before {
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background-image:url(https://images.unsplash.com/photo-1631737859822-d954fbb08f5f?q=80&w=1035&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;
    filter:brightness(1.2);
}
    
    .glass-main {
        border-radius:10px;
        background-color:#0000000;
        margin:20px;
        margin-top:30px;
        backdrop-filter: blur(10px);
        border-top:solid #ffffff50 1px;
        border-left:solid #ffffff50 1px;
        box-shadow:#00000010 3px 3px 3px;
        transition-duration:0.4s;
    }
    
    .glass-main:hover {
        backdrop-filter: blur(20px);
        transform:translateY(-3px);
    }
    
    #glass-one {
        margin-top:40px;
    }
    
    #glass-one > div {
        display:flex;
        padding:10px;
        gap:20px;
        align-items:center;
        width:540px;
        margin-left:auto;
        margin-right:auto;
    }
    
    img {
        transition-duration:0.4s;
    }
    
    img:hover {
        transform:translateY(-10px);
    }
    
    h1 {
        font-family:"Oswald", sans-serif;
    }
    
    button {
        border-width:4px;
        border-color:#d6a62c;
        width:200px;
        padding:10px;
        font-family:"IBM Plex Serif", serif;
        border-radius:100px;
        background-image:radial-gradient(white, #ECC65F);
        color:#d6a62c;
        box-shadow:#81651A 0px 0px 0px;
        transition-duration:0.4s;
    }
    
    button:hover {
        box-shadow:#81651A 0px 7px 0px;
        transform:translateY(-7px);
    }
    
    #album > img {
        border-radius:10px;
        width:130px;
    }
</style>
<body>
<div id="glass-one" class="glass-main">
    <div>
    <img src="https://new-song.pages.dev/favicon.ico" width="150px" height="150px">
    <div>
        <h1>Hello! I'm Newsong!</h1>
        <p>I make music on Youtube. If you want to use my music, it's free to use as long as you add credits. I make background tracks and relaxing tracks. I also make gospel music.</p>
    </div>
    </div>
</div>
<button>Listen Now!</button>
<div class="glass-main" id="album">
    <h1>Albums</h1>
    
    <img src="https://file.garden/Z_Zkhskjxktxt43S/Onion%20Tunes/album/uptospeed.png" href="/album/uptospeed" target="_blank">
    
    <img src="https://file.garden/Z_Zkhskjxktxt43S/Onion%20Tunes/album/just-better.png" href="/album/justbetter" target="_blank">
    
    <div style="margin-bottom:20px; color:#00000000;">12345</div>
</div>
<div class="glass-main">
    <h1>Contacts</h1>
    <a href="http://www.youtube.com/@new-song-makes-music/videos?sub_confirmation=1" target="_blank">
    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/1280px-YouTube_full-color_icon_%282017%29.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" width="50px"></a>
    
    <div style="margin-bottom:20px; color:#00000000;">12345</div>
</div>

</script>
</body>
</html>
