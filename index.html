<style>
    body {

    }

    }

    }

    p {

       font-family:"Outfit", sans-serif;
    }

    h4 {
       color:black;
       font-family:"Outfit", sans-serif;
    }

    .control {
       margin-top:30px;
       border-radius:25px;
       border:solid #94a3a8 1px;
       width:300px;
       padding:10px;
       padding-bottom:24px;
       margin-left:auto;
       margin-right:auto;
       box-shadow:#042a3550 0px 10px 10px 0px;
       display:flex;
       align-items:center;
       justify-content:space-between;
       gap:20px;
       margin-bottom:40px;
       box-sizing:border-box;
       transition:height 0.4s ease, width 0.6s ease;
       height:100px;
       overflow:hidden;
       position:relative;
    }

    .songinfo {
        text-align:left;
        min-width:0;
        flex:1;
    }

    .songinfo h4, .songinfo p {
        margin:5px;
    }

    .buttons {
        display:flex;
        align-items:center;
        flex-shrink:0;
    }

    .control img {
        margin-left:10px;
        margin-right:10px;
        transition:transform 0.4s, filter 0.4s;
        cursor:pointer;
    }

    .control img:hover {
        transform:scale(1.25) rotate(5deg);
        filter:drop-shadow(0px 3px 5px #00000080);
    }

    /* Progress bar */
    .progress-container {
        position:absolute;
        left:14px;
        right:14px;
        bottom:10px;
        height:6px;
        display:flex;
        align-items:center;
    }

    #progress {
        appearance:none;
        -webkit-appearance:none;
        display:block;
        width:100%;
        height:6px;
        margin:0;
        padding:0;
        border-radius:20px;
        outline:none;
        cursor:pointer;
        background:linear-gradient(
            to right,
            #5392e0 0%,
            #5392e0 var(--progress, 0%),
            #e5f9ff var(--progress, 0%),
            #e5f9ff 100%
        );
    }

    #progress::-webkit-slider-thumb {
        -webkit-appearance:none;
        appearance:none;
        width:12px;
        height:12px;
        border-radius:50%;
        background:#5392e0;
        box-shadow:0px 1px 3px #00000040;
    }

    #progress::-moz-range-thumb {
        width:9px;
        height:9px;
        border-radius:50%;
        background:#5392e0;
        box-shadow:0px 1px 3px #00000040;
    }

    .banner {
        color:black;
        display:flex;
        align-items:center;
        column-gap:20px;
        font-family:"Outfit", sans-serif;
        justify-content:center;
        width:100%;
        transform:
            translate3d(var(--shake-x, 0px), var(--shake-y, 0px), 0)
            rotate(var(--shake-rotation, 0deg))
            scale(var(--shake-scale, 1));
        will-change:transform;
    }

    .banner > img {
        filter:brightness(0%);
    }

    @media (max-width:600px) {
        .songlist {
            grid-template-columns:repeat(2, 1fr);
        }

        .control {
            width:90%;
        }
    }

    @media (max-width:450px) {
        .control {
            flex-direction:column;
            align-items:flex-start;
        }

        .buttons {
            align-self:center;
        }
    }

    @media (max-width:380px) {
        .songlist {
            grid-template-columns:1fr;
        }
    }
</style>

<script>
    const player = document.getElementById('player');
    const progress = document.getElementById('progress');

    player.crossOrigin = "anonymous";
    player.src = "https://file.garden/Z_Zkhskjxktxt43S/Onion%20Tunes/Audio/reflection-UNFINISHED-2.wav";

    // AUDIO VISUALIZER
    let audioContext;
    let analyser;
    let audioSource;
    let frequencyData;
    let waveformData;
    let animationFrame;

    const banner = document.getElementById('banner');

    // Sensitivity settings
    const BASS_THRESHOLD = 0.30;
    const VOLUME_THRESHOLD = 0.16;
    const SHAKE_INTENSITY = 1.8;

    let smoothedStrength = 0;

    function setupVisualizer() {
        if (audioContext) return;

        audioContext = new (window.AudioContext || window.webkitAudioContext)();

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;

        // Less smoothing lets us catch sudden drum hits
        analyser.smoothingTimeConstant = 0.45;

        frequencyData = new Uint8Array(analyser.frequencyBinCount);
        waveformData = new Uint8Array(analyser.fftSize);

        audioSource = audioContext.createMediaElementSource(player);

        audioSource.connect(analyser);
        analyser.connect(audioContext.destination);
    }

    function visualizeMusic() {
        if (!analyser || player.paused) {
            resetBanner();
            return;
        }

        analyser.getByteFrequencyData(frequencyData);
        analyser.getByteTimeDomainData(waveformData);

        // Calculate overall volume (RMS)
        let total = 0;

        for (let i = 0; i < waveformData.length; i++) {
            const sample = (waveformData[i] - 128) / 128;
            total += sample * sample;
        }

        const volume = Math.sqrt(total / waveformData.length);

        // Focus on the very low bass frequencies
        const bassLimit = Math.floor(120 / (audioContext.sampleRate / analyser.fftSize));

        let bassTotal = 0;

        for (let i = 1; i < bassLimit; i++) {
            bassTotal += frequencyData[i] / 255;
        }

        const bass = bassTotal / Math.max(1, bassLimit - 1);

        // Ignore small sounds completely
        const bassStrength = Math.max(0, (bass - BASS_THRESHOLD) / (1 - BASS_THRESHOLD));
        const volumeStrength = Math.max(0, (volume - VOLUME_THRESHOLD) / (0.55 - VOLUME_THRESHOLD));

        // Bass matters much more than general volume
        let rawStrength = Math.min(1, bassStrength * 1.5 + volumeStrength * 0.35);

        // Make the response more selective: weak sounds stay weak,
        // while strong hits become dramatically stronger
        rawStrength = Math.pow(rawStrength, 1.7);

        // Fast attack, slower release: reacts to hits, settles between them
        if (rawStrength > smoothedStrength) {
            smoothedStrength += (rawStrength - smoothedStrength) * 0.75;
        } else {
            smoothedStrength += (rawStrength - smoothedStrength) * 0.12;
        }

        const strength = smoothedStrength;

        // Only noticeable beats cause movement
        const shakeX = (Math.random() - 0.5) * strength * 34 * SHAKE_INTENSITY;
        const shakeY = (Math.random() - 0.5) * strength * 28 * SHAKE_INTENSITY;
        const rotation = (Math.random() - 0.5) * strength * 7 * SHAKE_INTENSITY;
        const scale = 1 + strength * 0.10;

        banner.style.setProperty('--shake-x', shakeX + 'px');
        banner.style.setProperty('--shake-y', shakeY + 'px');
        banner.style.setProperty('--shake-rotation', rotation + 'deg');
        banner.style.setProperty('--shake-scale', scale);

        animationFrame = requestAnimationFrame(visualizeMusic);
    }

    function resetBanner() {
        cancelAnimationFrame(animationFrame);
        smoothedStrength = 0;

        banner.style.setProperty('--shake-x', '0px');
        banner.style.setProperty('--shake-y', '0px');
        banner.style.setProperty('--shake-rotation', '0deg');
        banner.style.setProperty('--shake-scale', '1');
    }

    player.addEventListener('play', async () => {
        setupVisualizer();

        if (audioContext.state === 'suspended') {
            await audioContext.resume();
        }

        cancelAnimationFrame(animationFrame);
        visualizeMusic();
    });

    player.addEventListener('pause', resetBanner);
    player.addEventListener('ended', resetBanner);

    // PROGRESS BAR
    player.addEventListener('timeupdate', () => {
        if (player.duration && Number.isFinite(player.duration)) {
            const percentage = (player.currentTime / player.duration) * 1000;
            progress.value = percentage;
            updateProgressStyle();
        }
    });

    function updateProgressStyle() {
        const percentage = (progress.value / 1000) * 100;
        progress.style.setProperty('--progress', percentage + '%');
    }

    progress.addEventListener('input', () => {
        if (player.duration && Number.isFinite(player.duration)) {
            player.currentTime = (progress.value / 1000) * player.duration;
        }

        updateProgressStyle();
    });

    player.addEventListener('loadedmetadata', () => {
        progress.value = 0;
        updateProgressStyle();
    });

    player.addEventListener('ended', () => {
        progress.value = 1000;
        updateProgressStyle();
    });

    // TIMESTAMP
    player.addEventListener('timeupdate', () => {
        let ts = document.getElementById("timestamp");
        let time = player.currentTime;
        let min = Math.floor(time / 60);
        let sec = Math.floor(time) - min * 60;

        if (sec.toString().length === 1) {
            sec = "0" + sec;
        }

        ts.innerHTML = `${min}:${sec}`;
    });

    function songes(button, a, b, c) {
        document.querySelectorAll('.songlist > button').forEach(btn => {
            btn.classList.remove('active');
        });

        button.classList.add('active');

        const control = document.getElementById('control');

        const startWidth = control.getBoundingClientRect().width;
        const startHeight = control.getBoundingClientRect().height;

        player.src = a;
        document.getElementById('desc').innerText = b;
        document.getElementById('songname').innerText = c;
        document.getElementById('down').href = a;

        progress.value = 0;
        updateProgressStyle();

        player.play();

        const parentWidth = control.parentElement.clientWidth;
        const targetWidth = parentWidth * (window.innerWidth <= 600 ? 0.9 : 0.75);

        if (control._heightTransitionHandler) {
            control.removeEventListener('transitionend', control._heightTransitionHandler);
            control._heightTransitionHandler = null;
        }

        control.style.transition = 'none';
        control.style.width = targetWidth + 'px';
        control.style.height = 'auto';

        const targetHeight = control.getBoundingClientRect().height;

        control.style.width = startWidth + 'px';
        control.style.height = startHeight + 'px';
        control.offsetHeight;

        control.style.transition = '';
        control.offsetHeight;

        control.style.width = targetWidth + 'px';
        control.style.height = targetHeight + 'px';

        if (Math.abs(targetHeight - startHeight) < 1) {
            control.style.height = 'auto';
        } else {
            control._heightTransitionHandler = function finishHeight(e) {
                if (e.propertyName === 'height') {
                    control.style.height = 'auto';
                    control.removeEventListener('transitionend', control._heightTransitionHandler);
                    control._heightTransitionHandler = null;
                }
            };

            control.addEventListener('transitionend', control._heightTransitionHandler);
        }
    }
</script>
